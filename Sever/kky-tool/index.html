<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KKY Tool 사용자 관리</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", "Malgun Gothic", sans-serif; color: #1f2937; background: #f7f9fb; }
    main { max-width: 820px; margin: 0 auto; padding: 32px 20px 60px; }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { line-height: 1.6; color: #526173; }
    .panel { margin-top: 22px; padding: 24px; border: 1px solid #dbe5ee; border-radius: 8px; background: #fff; box-shadow: 0 8px 24px rgba(31,41,55,.06); }
    label { display: block; margin: 16px 0 6px; font-weight: 700; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
    textarea { min-height: 96px; resize: vertical; }
    .check { display: flex; gap: 10px; align-items: center; margin-top: 12px; font-weight: 600; }
    .check input { width: auto; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    button, a.button { border: 1px solid #9db5c9; border-radius: 6px; background: #fff; color: #1f4f73; padding: 10px 14px; cursor: pointer; text-decoration: none; font: inherit; }
    button.primary { background: #2f6f9f; color: #fff; border-color: #2f6f9f; }
    pre { margin-top: 16px; padding: 16px; border-radius: 8px; background: #0f172a; color: #dbeafe; overflow: auto; white-space: pre-wrap; }
    .status { margin-top: 12px; min-height: 22px; color: #526173; }
    .good { color: #0f766e; }
    .bad { color: #b91c1c; }
    .hidden { display: none; }
    .hint { font-size: 13px; color: #6b7280; }
    @media (max-width: 720px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <a class="button" href="../index.html">홈으로</a>
    <h1>KKY Tool 사용자 관리</h1>
    <p>각 PC에서 설정하지 않습니다. 이 페이지에서 중앙 정책 파일 <code>kky-tool/user-access.json</code>을 저장하면 KKY Tool이 이 키워드를 읽어 외부 사용자를 제한합니다.</p>

    <section id="lock" class="panel">
      <strong>관리자 인증</strong>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <div class="actions"><button class="primary" id="unlock">Unlock</button></div>
      <div id="lockStatus" class="status"></div>
    </section>

    <section id="editor" class="panel hidden">
      <label class="check" for="enabled">
        <input id="enabled" type="checkbox" checked>
        외부 사용자 제한 사용
      </label>

      <label for="keywords">허용 Autodesk/Revit 프로필 키워드</label>
      <textarea id="keywords" spellcheck="false" placeholder="KCIM"></textarea>
      <p class="hint">한 줄에 하나씩 입력하세요. 예: KCIM</p>

      <label for="users">정확히 허용할 사용자</label>
      <textarea id="users" spellcheck="false" placeholder="kim.kky&#10;hong.gildong"></textarea>

      <label for="message">차단 메시지</label>
      <input id="message" value="외부 사용자는 사용할 수 없습니다.">

      <div class="row">
        <div>
          <label for="owner">GitHub Owner</label>
          <input id="owner" value="zerokky11">
        </div>
        <div>
          <label for="repo">Repository</label>
          <input id="repo" value="Release">
        </div>
      </div>
      <div class="row">
        <div>
          <label for="branch">Branch</label>
          <input id="branch" value="main">
        </div>
        <div>
          <label for="path">File path</label>
          <input id="path" value="kky-tool/user-access.json">
        </div>
      </div>
      <label for="token">GitHub token</label>
      <input id="token" type="password" autocomplete="off" placeholder="Contents read/write token">

      <div class="actions">
        <button class="primary" id="build">Build JSON</button>
        <button id="reload">Reload current</button>
        <button id="copy">Copy JSON</button>
        <button id="download">Download</button>
        <button id="save">Save to GitHub Pages</button>
      </div>
      <div id="status" class="status"></div>
      <pre id="preview"></pre>
    </section>
  </main>

  <script>
    const PASSWORD_SHA256 = "9f27c8b87c38e457d773cc4d0c9a1583fec4cbaa9ca9bc75cf76ea4bfee83ba0";
    const POLICY_PATH = "kky-tool/user-access.json";
    const $ = (id) => document.getElementById(id);

    function setStatus(id, text, cls = "") {
      const el = $(id);
      el.textContent = text || "";
      el.className = "status " + cls;
    }

    function toHex(buffer) {
      return Array.from(new Uint8Array(buffer)).map((x) => x.toString(16).padStart(2, "0")).join("");
    }

    async function sha256(text) {
      return toHex(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)));
    }

    function splitList(value) {
      return String(value || "").split(/[\r\n,;]+/).map((x) => x.trim()).filter(Boolean);
    }

    function collect() {
      let keywords = splitList($("keywords").value);
      const users = splitList($("users").value);
      if (!keywords.length && !users.length) {
        keywords = ["KCIM"];
        $("keywords").value = "KCIM";
      }
      return {
        enabled: $("enabled").checked,
        allowedProfileKeywords: keywords,
        allowedUsers: users,
        blockMessage: $("message").value.trim() || "외부 사용자는 사용할 수 없습니다.",
        updatedAtUtc: new Date().toISOString()
      };
    }

    function fill(data) {
      data = data || {};
      $("enabled").checked = data.enabled !== false;
      $("keywords").value = Array.isArray(data.allowedProfileKeywords) ? data.allowedProfileKeywords.join("\n") : "KCIM";
      $("users").value = Array.isArray(data.allowedUsers) ? data.allowedUsers.join("\n") : "";
      $("message").value = data.blockMessage || data.message || "외부 사용자는 사용할 수 없습니다.";
      build();
    }

    function build() {
      const json = JSON.stringify(collect(), null, 2);
      $("preview").textContent = json;
      setStatus("status", "JSON preview updated.", "good");
      return json;
    }

    async function reload() {
      try {
        const response = await fetch("user-access.json", { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        fill(await response.json());
        setStatus("status", "Loaded current user-access.json.", "good");
      } catch (err) {
        fill({ enabled: true, allowedProfileKeywords: ["KCIM"], allowedUsers: [], blockMessage: "외부 사용자는 사용할 수 없습니다." });
        setStatus("status", "Current policy was not found. Default KCIM policy is ready.", "bad");
      }
    }

    function encodePath(path) {
      return String(path || "").split("/").map(encodeURIComponent).join("/");
    }

    function base64Utf8(text) {
      return btoa(unescape(encodeURIComponent(text)));
    }

    async function save() {
      const json = build();
      const owner = $("owner").value.trim();
      const repo = $("repo").value.trim();
      const branch = $("branch").value.trim() || "main";
      const path = $("path").value.trim() || POLICY_PATH;
      const token = $("token").value.trim();
      if (!owner || !repo || !token) {
        setStatus("status", "Owner, repository, and GitHub token are required.", "bad");
        return;
      }

      const apiPath = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${encodePath(path)}`;
      const headers = {
        "Accept": "application/vnd.github+json",
        "Authorization": "Bearer " + token,
        "X-GitHub-Api-Version": "2022-11-28"
      };

      setStatus("status", "Saving user-access.json to GitHub...", "");
      const currentResponse = await fetch(apiPath + "?ref=" + encodeURIComponent(branch), { headers });
      let current = null;
      if (currentResponse.ok) current = await currentResponse.json();
      else if (currentResponse.status !== 404) throw new Error("GitHub read failed: " + currentResponse.status);

      const body = {
        message: "Update KKY Tool user access policy",
        content: base64Utf8(json + "\n"),
        branch
      };
      if (current && current.sha) body.sha = current.sha;

      const saveResponse = await fetch(apiPath, {
        method: "PUT",
        headers: Object.assign({ "Content-Type": "application/json" }, headers),
        body: JSON.stringify(body)
      });
      if (!saveResponse.ok) throw new Error("GitHub save failed: " + saveResponse.status + " " + await saveResponse.text());
      setStatus("status", "Saved. KKY Tool clients will follow this central policy.", "good");
    }

    $("unlock").addEventListener("click", async () => {
      try {
        if (await sha256($("password").value || "") !== PASSWORD_SHA256) {
          setStatus("lockStatus", "Wrong password.", "bad");
          return;
        }
        $("lock").classList.add("hidden");
        $("editor").classList.remove("hidden");
        await reload();
      } catch (err) {
        setStatus("lockStatus", err.message || String(err), "bad");
      }
    });
    $("password").addEventListener("keydown", (ev) => { if (ev.key === "Enter") $("unlock").click(); });
    $("build").addEventListener("click", build);
    $("reload").addEventListener("click", reload);
    $("copy").addEventListener("click", () => navigator.clipboard.writeText(build()));
    $("download").addEventListener("click", () => {
      const blob = new Blob([build() + "\n"], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "user-access.json";
      a.click();
      URL.revokeObjectURL(url);
    });
    $("save").addEventListener("click", () => save().catch((err) => setStatus("status", err.message || String(err), "bad")));
    fill({ enabled: true, allowedProfileKeywords: ["KCIM"], allowedUsers: [], blockMessage: "외부 사용자는 사용할 수 없습니다." });
  </script>
</body>
</html>
